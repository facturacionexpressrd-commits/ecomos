version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecomos
    ports:
      - "5432:5432"
    volumes:
      - ecomos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ecomos-db-data:
